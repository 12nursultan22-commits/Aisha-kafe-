<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aisha — семейное кафе · Меню</title>
  <meta name="description" content="Электронное меню семейного кафе Aisha, Кандыагаш · Aisha отбасылық кафесінің мәзірі">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="lang" role="group" aria-label="Тіл / Язык">
      <button class="lang__btn" data-lang="kz" aria-pressed="false">ҚАЗ</button>
      <button class="lang__btn" data-lang="ru" aria-pressed="true">РУС</button>
    </div>
    <img class="hero__logo" src="img/logo.png" alt="Aisha — семейное кафе" width="160" height="160">
    <h1 class="hero__title" id="heroTitle">Меню</h1>
    <p class="hero__meta" id="heroMeta"></p>
  </header>

  <nav class="tabs" id="tabs">
    <div class="tabs__search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Поиск блюда…" autocomplete="off">
    </div>
    <div class="tabs__row" id="tabsRow"></div>
  </nav>

  <main id="menu" class="menu"></main>
  <p class="empty" id="empty" hidden></p>

  <footer class="footer" id="footer"></footer>

  <button class="cart-btn" id="cartBtn" hidden>
    <span id="cartLabel">Мой заказ</span>
    <span class="cart-btn__count" id="cartCount">0</span>
    <span class="cart-btn__sum" id="cartSum"></span>
  </button>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <section class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet__head">
        <h2 id="sheetTitle">Мой заказ</h2>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <ul class="sheet__list" id="cartList"></ul>
      <div class="sheet__total">
        <span id="totalLabel">Итого</span><strong id="cartTotal"></strong>
      </div>
      <p class="sheet__hint" id="sheetHint"></p>
      <div class="sheet__actions">
        <button class="btn btn--ghost" id="cartClear">Очистить</button>
        <a class="btn btn--gold" id="cartWa" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
